name: Publish release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: filewarden-tested-candidate
          path: release
      - name: Publish tested installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          archive="filewarden-$version.zip"
          cd release
          unzip -t "$archive"
          sha256sum "$archive" > "$archive.sha256"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          notes="$GITHUB_WORKSPACE/docs/releases/$TAG.md"
          if [[ -f "$notes" ]]; then
            flags+=(--notes-file "$notes")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "FileWarden $version" "${flags[@]}"
