name: Quality and security checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/admin.test.cjs
  unit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, zip, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-plugins
      - run: find includes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer lint
      - run: composer test
      - run: composer audit
      - run: python3 tools/translation-catalogs.py --check
      - name: Build installable ZIP
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            php tools/build.php "$GITHUB_REF_NAME"
          else
            php tools/build.php
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.2'
        with:
          name: filewarden-development
          path: build/filewarden-*.zip
          if-no-files-found: error
  fresh-install:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-db-password
          MYSQL_DATABASE: filewarden_fresh
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pdisposable-db-password" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      FILEWARDEN_TESTING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, fileinfo, zip, sodium
          tools: wp-cli
          coverage: none
      - name: Verify empty installation defaults and destinations
        run: |
          mkdir -p /tmp/fw-fresh /tmp/fw-fresh-private
          chmod 700 /tmp/fw-fresh-private
          wp core download --path=/tmp/fw-fresh --version=6.8
          wp config create --path=/tmp/fw-fresh --dbname=filewarden_fresh --dbuser=root --dbpass=disposable-db-password --dbhost=127.0.0.1:3306 --dbprefix=fwfresh_
          wp config set FILEWARDEN_STORAGE_DIR /tmp/fw-fresh-private --path=/tmp/fw-fresh
          wp config set FILEWARDEN_STORAGE_VERIFIED true --raw --path=/tmp/fw-fresh
          wp core install --path=/tmp/fw-fresh --url=http://127.0.0.1:8080 --title=FileWarden --admin_user=fw_admin --admin_password=disposable-test-password --admin_email=admin@example.test --skip-email
          php tools/build.php
          wp plugin install "$GITHUB_WORKSPACE/build/$(basename build/filewarden-*.zip)" --activate --path=/tmp/fw-fresh
          wp eval-file "$GITHUB_WORKSPACE/tests/fresh-install.php" --path=/tmp/fw-fresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify first-folder and contextual upload in a real browser
        shell: bash
        run: |
          npm install --prefix /tmp/fw-browser --ignore-scripts --no-audit --no-fund playwright@1.65.0
          node /tmp/fw-browser/node_modules/playwright/cli.js install --with-deps chromium
          php -S 127.0.0.1:8080 -t /tmp/fw-fresh > /tmp/fw-fresh-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          mkdir -p build/screenshots
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8080/wp-login.php > /dev/null; then break; fi
            sleep 1
          done
          FILEWARDEN_URL=http://127.0.0.1:8080 NODE_PATH=/tmp/fw-browser/node_modules node tests/v17-fresh-browser.cjs
      - name: Check the installed ZIP with official Plugin Check
        run: |
          wp plugin install plugin-check --version=2.2.0 --path=/tmp/fw-fresh
          wp --require=/tmp/fw-fresh/wp-content/plugins/plugin-check/cli.php plugin check filewarden --path=/tmp/fw-fresh --format=strict-json > build/plugin-check.json
          python3 tools/check-pcp-result.py build/plugin-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-workspace-screenshots
          path: build/screenshots/**/*.png
          if-no-files-found: ignore
  integration:
    timeout-minutes: 45
    name: integration (WP ${{ matrix.wordpress }}, from ${{ matrix.previous.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.8', 'latest']
        previous:
          - {version: '0.1.11-dev', schema: '4'}
          - {version: '0.1.12-dev', schema: '5'}
          - {version: '0.1.13-dev', schema: '6'}
          - {version: '0.1.14-dev', schema: '6'}
          - {version: '0.1.15-dev', schema: '6'}
          - {version: '0.1.16-dev', schema: '6'}
          - {version: '0.1.17-dev', schema: '6'}
          - {version: '0.1.19-alpha.1', schema: '9'}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-db-password
          MYSQL_DATABASE: filewarden_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pdisposable-db-password" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      FILEWARDEN_TESTING: '1'
      FILEWARDEN_FIXTURES: /tmp/filewarden-fixtures.json
      FILEWARDEN_URL: http://127.0.0.1:8080
      FILEWARDEN_UPGRADE_FIXTURE: /tmp/filewarden-upgrade.json
      FILEWARDEN_PREVIOUS_VERSION: ${{ matrix.previous.version }}
      FILEWARDEN_PREVIOUS_SCHEMA: ${{ matrix.previous.schema }}
      FILEWARDEN_PREVIOUS_ENGINE: ${{ matrix.previous.version == '0.1.14-dev' && 'MyISAM' || 'InnoDB' }}
      FILEWARDEN_TARGET_VERSION: '0.1.19-beta.1'
      FILEWARDEN_ACCEPTANCE_DIR: /tmp/.tools/filewarden-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, fileinfo, zip, dom, sodium
          tools: wp-cli
          coverage: none
      - name: Prepare disposable WordPress
        shell: bash
        run: |
          mkdir -p /tmp/fw-wordpress /tmp/fw-private
          chmod 700 /tmp/fw-private
          wp core download --path=/tmp/fw-wordpress --version=${{ matrix.wordpress }}
          wp config create --path=/tmp/fw-wordpress --dbname=filewarden_test --dbuser=root --dbpass=disposable-db-password --dbhost=127.0.0.1:3306 --dbprefix=fwtest_
          wp config set FILEWARDEN_STORAGE_DIR /tmp/fw-private --path=/tmp/fw-wordpress
          wp config set FILEWARDEN_STORAGE_VERIFIED true --raw --path=/tmp/fw-wordpress
          wp core install --path=/tmp/fw-wordpress --url=http://127.0.0.1:8080 --title=FileWarden --admin_user=fw_admin --admin_password=disposable-test-password --admin_email=admin@example.test --skip-email
          wp language core install fr_FR de_DE fr_CA --path=/tmp/fw-wordpress
          wp i18n make-pot "$GITHUB_WORKSPACE" /tmp/filewarden-current.pot --exclude=.tools,build,vendor,tests,assets/pdfjs --skip-js --skip-audit
          python3 tools/translation-catalogs.py --check --pot /tmp/filewarden-current.pot
          curl --fail --location --retry 3 https://github.com/MikaPST/filewarden/releases/download/v${{ matrix.previous.version }}/filewarden-${{ matrix.previous.version }}.zip -o /tmp/filewarden-${{ matrix.previous.version }}.zip
          curl --fail --location --retry 3 https://github.com/MikaPST/filewarden/releases/download/v${{ matrix.previous.version }}/filewarden-${{ matrix.previous.version }}.zip.sha256 -o /tmp/filewarden-${{ matrix.previous.version }}.zip.sha256
          (cd /tmp && sha256sum --check filewarden-${{ matrix.previous.version }}.zip.sha256)
          wp plugin install /tmp/filewarden-${{ matrix.previous.version }}.zip --activate --path=/tmp/fw-wordpress
          FILEWARDEN_UPGRADE_STAGE=before wp eval-file "$GITHUB_WORKSPACE/tests/upgrade-fixture.php" --path=/tmp/fw-wordpress
          php tools/build.php
          wp plugin install "$GITHUB_WORKSPACE/build/$(basename build/filewarden-*.zip)" --force --activate --path=/tmp/fw-wordpress
          FILEWARDEN_UPGRADE_STAGE=after wp eval-file "$GITHUB_WORKSPACE/tests/upgrade-fixture.php" --path=/tmp/fw-wordpress
          wp eval-file "$GITHUB_WORKSPACE/tests/integration.php" --path=/tmp/fw-wordpress
      - name: Test WordPress Sodium PHP fallback
        run: php tests/sodium-compat.php /tmp/fw-wordpress/wp-includes/sodium_compat/autoload.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real browser tests
        run: |
          npm install --prefix /tmp/fw-browser --ignore-scripts --no-audit --no-fund playwright@1.65.0
          node /tmp/fw-browser/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Exercise browser HTTP routes
        shell: bash
        run: |
          mkdir -p /tmp/fw-wordpress/wp-content/mu-plugins
          cp tests/corrections-http-fixture.php /tmp/fw-wordpress/wp-content/mu-plugins/filewarden-test-corrections.php
          cp tests/v16-http-fixture.php /tmp/fw-wordpress/wp-content/mu-plugins/filewarden-test-v16.php
          php -S 127.0.0.1:8080 -t /tmp/fw-wordpress > /tmp/fw-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8080/wp-login.php > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/http-smoke.py
          mkdir -p "$FILEWARDEN_ACCEPTANCE_DIR"
          chmod 700 "$FILEWARDEN_ACCEPTANCE_DIR"
          wp eval-file "$GITHUB_WORKSPACE/tests/beta-pcp-integration.php" --path=/tmp/fw-wordpress
          FW_DOCUMENT_STAGE=ci wp eval-file "$GITHUB_WORKSPACE/tests/v19-document-integration.php" --path=/tmp/fw-wordpress
          wp eval-file "$GITHUB_WORKSPACE/tests/v19-same-name-integration.php" --path=/tmp/fw-wordpress
          FILEWARDEN_UI_RESULT="$FILEWARDEN_ACCEPTANCE_DIR/ui-fixture.json" wp eval-file "$GITHUB_WORKSPACE/tests/v19-ui-corrections.php" --path=/tmp/fw-wordpress
          NODE_PATH=/tmp/fw-browser/node_modules node tests/alpha-browser-suite.cjs
          wp user meta update fw_admin locale fr_FR --path=/tmp/fw-wordpress
          wp option update WPLANG fr_FR --path=/tmp/fw-wordpress
          wp option update filewarden_language fr_FR --path=/tmp/fw-wordpress
          FILEWARDEN_BROWSER_SUFFIX=fr NODE_PATH=/tmp/fw-browser/node_modules node tests/alpha-browser-suite.cjs
          FW_SAME_NAME_VERIFY=1 wp eval-file "$GITHUB_WORKSPACE/tests/v19-same-name-integration.php" --path=/tmp/fw-wordpress
          mkdir -p /tmp/fw-restore /tmp/fw-restore-private
          chmod 700 /tmp/fw-restore-private
          wp core download --path=/tmp/fw-restore --version=6.8
          wp config create --path=/tmp/fw-restore --dbname=filewarden_test --dbuser=root --dbpass=disposable-db-password --dbhost=127.0.0.1:3306 --dbprefix=fwrestore_
          wp config set FILEWARDEN_STORAGE_DIR /tmp/fw-restore-private --path=/tmp/fw-restore
          wp config set FILEWARDEN_STORAGE_VERIFIED true --raw --path=/tmp/fw-restore
          wp core install --path=/tmp/fw-restore --url=http://127.0.0.1:8081 --title=FileWarden --admin_user=fw_admin --admin_password=disposable-test-password --admin_email=admin@example.test --skip-email
          wp plugin install "$GITHUB_WORKSPACE/build/$(basename build/filewarden-*.zip)" --activate --path=/tmp/fw-restore
          FW_DOCUMENT_STAGE=restore wp eval-file "$GITHUB_WORKSPACE/tests/v19-document-integration.php" --path=/tmp/fw-restore
      - name: Preserve the exact ZIP installed and tested
        uses: actions/upload-artifact@v4
        if: success() && matrix.wordpress == '6.8' && matrix.previous.version == '0.1.19-alpha.1'
        with:
          name: filewarden-tested-candidate
          path: build/filewarden-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-screenshots-${{ matrix.wordpress }}-from-${{ matrix.previous.version }}
          path: build/screenshots/**/*.png
          if-no-files-found: ignore
