name: Quality and security checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/admin.test.cjs
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, fileinfo, zip, sodium
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-plugins
      - run: find includes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer lint
      - run: composer test
      - run: composer audit
      - name: Build installable ZIP
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            php tools/build.php "$GITHUB_REF_NAME"
          else
            php tools/build.php
          fi
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.2'
        with:
          name: filewarden-development
          path: build/filewarden-*.zip
          if-no-files-found: error
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wordpress: ['6.8', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-db-password
          MYSQL_DATABASE: filewarden_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pdisposable-db-password" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      FILEWARDEN_TESTING: '1'
      FILEWARDEN_FIXTURES: /tmp/filewarden-fixtures.json
      FILEWARDEN_UPGRADE_FIXTURE: /tmp/filewarden-upgrade.json
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, fileinfo, zip, dom, sodium
          tools: wp-cli
          coverage: none
      - name: Prepare disposable WordPress
        shell: bash
        run: |
          mkdir -p /tmp/fw-wordpress /tmp/fw-private
          chmod 700 /tmp/fw-private
          wp core download --path=/tmp/fw-wordpress --version=${{ matrix.wordpress }}
          wp config create --path=/tmp/fw-wordpress --dbname=filewarden_test --dbuser=root --dbpass=disposable-db-password --dbhost=127.0.0.1:3306 --dbprefix=fwtest_
          wp config set FILEWARDEN_STORAGE_DIR /tmp/fw-private --path=/tmp/fw-wordpress
          wp config set FILEWARDEN_STORAGE_VERIFIED true --raw --path=/tmp/fw-wordpress
          wp core install --path=/tmp/fw-wordpress --url=http://127.0.0.1:8080 --title=FileWarden --admin_user=fw_admin --admin_password=disposable-test-password --admin_email=admin@example.test --skip-email
          wp language core install fr_FR --path=/tmp/fw-wordpress
          curl --fail --location --retry 3 https://github.com/MikaPST/filewarden/releases/download/v0.1.11-dev/filewarden-0.1.11-dev.zip -o /tmp/filewarden-0.1.11-dev.zip
          curl --fail --location --retry 3 https://github.com/MikaPST/filewarden/releases/download/v0.1.11-dev/filewarden-0.1.11-dev.zip.sha256 -o /tmp/filewarden-0.1.11-dev.zip.sha256
          (cd /tmp && sha256sum --check filewarden-0.1.11-dev.zip.sha256)
          wp plugin install /tmp/filewarden-0.1.11-dev.zip --activate --path=/tmp/fw-wordpress
          FILEWARDEN_UPGRADE_STAGE=before wp eval-file "$GITHUB_WORKSPACE/tests/upgrade-fixture.php" --path=/tmp/fw-wordpress
          php tools/build.php
          wp plugin install "$GITHUB_WORKSPACE/build/$(basename build/filewarden-*.zip)" --force --activate --path=/tmp/fw-wordpress
          FILEWARDEN_UPGRADE_STAGE=after wp eval-file "$GITHUB_WORKSPACE/tests/upgrade-fixture.php" --path=/tmp/fw-wordpress
          wp eval-file "$GITHUB_WORKSPACE/tests/integration.php" --path=/tmp/fw-wordpress
      - name: Test WordPress Sodium PHP fallback
        run: php tests/sodium-compat.php /tmp/fw-wordpress/wp-includes/sodium_compat/autoload.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare real browser tests
        run: |
          npm install --prefix /tmp/fw-browser --ignore-scripts --no-audit --no-fund playwright@1.65.0
          node /tmp/fw-browser/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Exercise browser HTTP routes
        shell: bash
        run: |
          php -S 127.0.0.1:8080 -t /tmp/fw-wordpress > /tmp/fw-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8080/wp-login.php > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/http-smoke.py
          NODE_PATH=/tmp/fw-browser/node_modules node tests/viewer-browser.cjs
          wp user meta update fw_admin locale fr_FR --path=/tmp/fw-wordpress
          NODE_PATH=/tmp/fw-browser/node_modules node tests/french-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-screenshots-${{ matrix.wordpress }}
          path: build/screenshots/*.png
          if-no-files-found: ignore
